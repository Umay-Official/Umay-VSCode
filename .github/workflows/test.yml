name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:vscode
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: umay-vsix
          path: '*.vsix'
